<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="地点を自由に配置し、巡回セールスマン問題の最短経路を厳密計算・可視化するツール。"><title>TSP 最短経路探索ツール — tanakashoi</title><link rel="stylesheet" href="/tools/tool-style.css"></head><body><main class="tool-shell"><nav class="tool-nav"><a href="/">‹ ポートフォリオに戻る</a><span>tanakashoi / Web Tool</span></nav><header class="tool-hero"><p class="eyebrow">Exact Route Explorer</p><h1>TSP 最短経路探索</h1><p>地点をクリックして追加し、すべての地点を一度ずつ通って出発点へ戻る最短経路を求めます。部分集合動的計画法による厳密解を、その場で可視化します。</p></header><section class="workspace" aria-label="TSP計算ツール"><div class="toolbar"><button class="button primary" id="solve" type="button">最短経路を計算</button><button class="button" id="randomize" type="button">地点を再生成</button><button class="button" id="undo" type="button">1つ戻す</button><button class="button" id="clear" type="button">クリア</button><span class="status" id="status" aria-live="polite"></span></div><div class="canvas-wrap"><canvas id="tsp-canvas" width="960" height="540" aria-label="地点と最短巡回路の可視化"></canvas></div><p class="hint">緑のAが出発点です。キャンバス上をクリックすると最大14地点まで追加できます。地点数が多いほど計算量が増えます。</p><div class="metrics"><div class="metric"><span>地点数</span><strong id="point-count">0</strong></div><div class="metric"><span>経路長</span><strong id="distance">—</strong></div><div class="metric"><span>計算時間</span><strong id="elapsed">—</strong></div></div></section></main><script type="module" src="/tools/tsp.mjs"></script></body></html>
