<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="重み付き投票ゲームのShapley–Shubik指数を厳密計算するツール。"><title>SS指数 計算サイト — tanakashoi</title><link rel="stylesheet" href="/tools/tool-style.css"></head><body><main class="tool-shell"><nav class="tool-nav"><a href="/">‹ ポートフォリオに戻る</a><span>tanakashoi / Web Tool</span></nav><header class="tool-hero"><p class="eyebrow">Voting Power Calculator</p><h1>SS指数 計算サイト</h1><p>議席数や持分などの「重み」と可決基準を入力し、各プレイヤーが決定票を握る確率をShapley–Shubik指数として厳密に計算します。</p></header><section class="workspace" aria-label="SS指数計算ツール"><div class="field-row"><div class="field"><label for="quota">可決基準</label><input id="quota" type="number" min="0.0001" step="any" value="51"></div><div class="field"><label>計算方法</label><input value="全提携を列挙する厳密計算" readonly></div></div><div id="player-list" class="player-list"></div><div class="toolbar" style="margin-top:20px"><button class="button primary" id="calculate" type="button">SS指数を計算</button><button class="button" id="add-player" type="button">プレイヤーを追加</button><button class="button" id="example" type="button">例に戻す</button></div><p class="error" id="error" aria-live="polite"></p><div class="result-list" id="results" aria-live="polite"></div><div class="formula"><strong>SS指数とは</strong><br>すべての投票順序が同じ確率で起こると仮定し、あるプレイヤーの参加によって累積重みが初めて可決基準へ達する割合です。指数の合計は通常100%になります。プレイヤー数は2〜18人に対応しています。</div></section></main><script type="module" src="/tools/ss-index.mjs"></script></body></html>
